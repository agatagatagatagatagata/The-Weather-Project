<script>


AFRAME.registerComponent('cursor-listener-sun', {
  init: function () {
this.el.addEventListener('mouseenter', function (evt)
{
document.querySelector('#msg-1').emit('triggeranimation');
document.querySelector('#msg-1-5').emit('triggeranimation');
});


this.el.addEventListener('mouseleave', function (evt)
{
document.querySelector('#msg-1').setAttribute('visible', false);
document.querySelector('#msg-1-5').setAttribute('visible', false);
});

  }
});

AFRAME.registerComponent('cursor-listener-2', {
  init: function () {
this.el.addEventListener('mouseenter', function (evt)
{
document.querySelector('#msg-2').setAttribute('visible', true);

});

this.el.addEventListener('mouseleave', function (evt)
{
document.querySelector('#msg-2').setAttribute('visible', false);
document.querySelector('#msg-2').setAttribute('opacity', "0");
});

});

AFRAME.registerComponent('cursor-listener-3', {
  init: function () {

});

{
document.querySelector('#msg-3').setAttribute('visible', false);
document.querySelector('#msg-3').setAttribute('opacity', "0");
});

  }
});

AFRAME.registerComponent("foo", {
     init: function() {
       this.el.addEventListener("loaded", e => {
         this.el.setAttribute("look-at", "[camera]")
       })
     }
   });

function playButton(){
	document.getElementById("start").style.display = "none";
	var audio = document.getElementById("myAudio"); 
	audio.loop=true;
	audio.volume=0.3;
	audio.play();
}

</script>

<a-text id="msg-1-5" value="Olafur Eliasson, 2003" align="center" scale="6 6 6" opacity="1" color="#1d0b02" blending="multiply" position="0 8 -35" font="sourcecodepro" animation="property: opacity; to: 0; dur: 100; startEvents: triggeranimation;"></a-text>


<a-entity position="-2.77337 1.46451 -2.82312" rotation="0 0 0">
	<a-text id="msg-2" value="Created for the Turbine Hall of Tate Modern, London, this site-specific installation employed a semi-circular screen, a ceiling of mirrors, and artificial mist to create the illusion of a sun. Aluminium frames lined with mirror foil were suspended from the ceiling to create a giant mirror that visually doubled the volume of the hall – along with the semi-circular screen mounted on the far wall, its long edge abutting the mirror ceiling. Backlit by approximately 200 mono-frequency lights, the semi-circle and its reflection created the image of a massive, indoor sunset seen through the artificial mist emitted into the room. By walking to the far end of the hall, visitors could see how the sun was constructed, and the reverse of the mirror structure was visible from the top floor of the museum." visible="false" opacity="0" align= "center" width="1.87" wrap-count="60" color=" white" scale="2 2 2" font="sourcecodepro" rotation="0 0 0" animation="property: opacity; to: 1; dur: 100; startEvents: triggeranimation;" foo></a-text>
</a-entity>


<a-entity position="2.77337 1.46451 -2.82312" rotation="0 0 0">
	<a-text id="msg-3" value="In preparation for the exhibition, Eliasson devised a questionnaire for the employees at Tate Modern that included questions such as: ‘Has a weather phenomenon ever changed the course of your life dramatically?’ ‘Do you think tolerance to other individuals is proportional to the weather?’ ‘To what extent are you aware of the weather outside your workplace?’ The results were published in the catalogue accompanying the exhibition, which also included a roundtable discussion about the communication of art, meteorological reports of freak weather events, weather statistics, and a series of essays on the weather, time, and space." visible="false" opacity="0" align= "center" width="1.87" wrap-count="60" color=" white" scale="2 2 2" font="sourcecodepro" rotation="0 0 0" animation="property: opacity; to: 1; dur: 100; startEvents: triggeranimation;" foo></a-text>
</a-entity>
